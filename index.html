<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeRock</title>
    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-wrapper">
      <header>
        <nav>
          <div class="logo-wrapper">
            <div class="logo-icon"></div>
            <div class="logo">PokeRock</div>
          </div>
          <div class="navbar">
            <button><a href="">Explore</a></button>
            <button><a href="">Saved</a></button>
          </div>
        </nav>
        <div class="hero">
          <div class="hero-content">
            <div class="hero-subtext">
              <div class="dot"></div>
              <div class="subtext">Rock your Pokemons.</div>
            </div>
            <h1>Find your next favourite.</h1>
            <h4>
              Explore the creatures, elemental disciplines, and natural history
              of the Pokemon World.
            </h4>
            <form class="search-bar">
              <div class="search-icon">P</div>
              <input type="text" placeholder="Find your Pokemon" />
              <div class="search-btn">
                <button type="submit">Search</button>
              </div>
            </form>
          </div>
          <div class="hero-index">
            <h3><span id="idx"></span> Pokemons</h3>
          </div>
        </div>
      </header>
      <main>
        <div class="main-nav">main navigation placeholder</div>
        <div id="pokemonWrapper"></div>
        <div class="pagination">
          <button id="prev" disabled><i class="fa-solid fa-arrow-left"></i></button>
          <span id="pageNum"></span>
          <button id="next"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </main>
      <footer></footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
